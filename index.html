<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171916">
  <title>方块时间 · 俄罗斯方块</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span> BLOCK / CLUB</div>
      <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">READY TO PLAY</span></div>
    </header>
    <section class="intro">
      <h1>方块<span>时间</span></h1>
      <p>排好队，消掉线，再来一局。</p>
    </section>
    <!-- 左侧显示状态与预览，中间是棋盘，右侧提供操作和纪录。 -->
    <section class="game-layout" aria-label="俄罗斯方块游戏">
      <aside class="side">
        <section class="panel">
          <div class="panel-label">得分 <b>POINTS</b></div>
          <div class="score-value" id="score">000000</div>
          <div class="mini-stats">
            <div class="mini-stat"><span>等级</span><strong id="level">01</strong></div>
            <div class="mini-stat"><span>消行</span><strong id="lines">00</strong></div>
          </div>
        </section>
        <section class="panel preview-panel">
          <div class="panel-label">下一个 <b>NEXT</b></div>
          <canvas class="preview-canvas" id="next" aria-label="下一个方块"></canvas>
        </section>
        <section class="panel hold-panel">
          <div class="panel-label">暂存 <b>HOLD</b></div>
          <canvas class="hold-canvas" id="hold" aria-label="暂存方块"></canvas>
        </section>
      </aside>
      <div class="board-wrap">
        <canvas id="board" aria-label="俄罗斯方块棋盘"></canvas>
        <div class="overlay" id="overlay">
          <div class="eyebrow">BLOCK / CLUB</div>
          <h2 id="overlayTitle">准备好了吗？</h2>
          <p id="overlayText">把方块排成完整的一行。</p>
          <button id="overlayButton" type="button">开始游戏</button>
        </div>
      </div>
      <aside class="side">
        <section class="panel actions">
          <div class="panel-label">控制台 <b>PLAY</b></div>
          <button class="action-button primary" id="startButton" type="button"><span>开始游戏</span><kbd>ENTER</kbd></button>
          <button class="action-button" id="pauseButton" type="button"><span>暂停</span><kbd>P</kbd></button>
          <button class="action-button" id="restartButton" type="button"><span>重新开始</span><kbd>R</kbd></button>
        </section>
        <section class="panel right-panel">
          <div class="panel-label">最佳纪录 <b>BEST</b></div>
          <div class="score-value" id="best">000000</div>
          <div class="record">本机最高分<br><strong id="bestLines">0</strong> 行已被清除</div>
        </section>
        <section class="panel help">
          <div class="panel-label">操作说明 <b>KEYS</b></div>
          <div class="help-row"><span class="key">←</span><span class="key">→</span>移动</div>
          <div class="help-row"><span class="key">↑</span>加速下落</div>
          <div class="help-row"><span class="key">↓</span>加速下落</div>
          <div class="help-row"><span class="key">SPACE</span>旋转</div>
          <div class="help-row"><span class="key">C</span>暂存方块</div>
        </section>
      </aside>
    </section>
    <nav class="touch-controls" aria-label="触屏控制">
      <button type="button" data-action="left" aria-label="左移">←</button>
      <button type="button" data-action="rotate" aria-label="旋转">↻</button>
      <button type="button" data-action="down" aria-label="下移">↓</button>
      <button type="button" data-action="right" aria-label="右移">→</button>
      <button class="drop" type="button" data-action="drop" aria-label="直接落下">⇊</button>
    </nav>
    <footer class="footer"><span>ONE MORE LINE.</span><span>EST. YOUR NEXT HIGH SCORE</span></footer>
  </main>
  <script src="game-logic.js"></script>
  <script src="game-renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
